name: Security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  defensive-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install audited tools and project
        run: |
          python -m pip install --disable-pip-version-check pip==26.2
          python -m pip install --disable-pip-version-check -e '.[test,dashboard]'
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
      - name: Secret and repository guard
        run: |
          python scripts/check_forbidden_tracked_files.py --root .
          python scripts/check_workflow_pins.py --root .
      - name: Dependency audit
        run: |
          python -m pip check
          # The project is intentionally installed editable for tests and is not
          # published on PyPI. Audit every third-party distribution, excluding
          # only that local editable package; known vulnerabilities still fail.
          python -m pip_audit --desc --skip-editable
      - name: Static analysis
        run: bandit -q -r src scripts -x tests -ll
