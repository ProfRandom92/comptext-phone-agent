name: Security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  defensive-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install audited tools and project
        run: |
          python -m pip install --disable-pip-version-check pip==26.2
          python -m pip install --disable-pip-version-check -e '.[test,dashboard]'
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
      - name: Secret and repository guard
        run: |
          python scripts/check_forbidden_tracked_files.py --root .
          python scripts/check_workflow_pins.py --root .
      - name: Dependency audit
        run: |
          python -m pip check
          # The project is intentionally installed editable for tests and is not
          # published on PyPI. Audit every third-party distribution, excluding
          # only that local editable package; known vulnerabilities still fail.
          python -m pip_audit --desc --skip-editable
      - name: Static analysis
        run: bandit -q -r src scripts -x tests -ll

  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Set up JDK 21 for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Make Gradle wrapper executable
        if: matrix.language == 'java-kotlin'
        working-directory: android-broker
        run: chmod +x gradlew

      - name: Build Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android-broker
        run: ./gradlew :app:compileDebugKotlin --dependency-verification strict --no-daemon --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
