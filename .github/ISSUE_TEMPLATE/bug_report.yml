name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Remove API keys, tokens, personal paths, file listings, audit databases and device identifiers before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.6.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Termux on Android
        - Linux sandbox
        - Android broker
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use mock or sanitized paths where possible.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include concise logs, exit codes or screenshots with sensitive values removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, personal paths, private file listings and device identifiers.
          required: true
        - label: I reproduced this with the latest available commit or explained why I could not.
          required: true